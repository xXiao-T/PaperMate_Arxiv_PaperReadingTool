# 发布工作流：推送 vX.Y.Z 格式的 tag 时触发。
# release gate：tag 指向的提交必须是 main 上的提交（main 的祖先），否则拒绝发布。
# 通过后在 tag 所指提交上构建（后端 jar + 前端构建产物）并创建 Release。
name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+      # 匹配 v0.1.0 形式；这是 GitHub 的过滤语法，不是正则表达式

permissions:
  contents: write                   # 创建 Release 需要写权限；ci 保持只读

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # 获取完整历史，才能判断 tag 是否在 main 上

      - name: release gate（tag 必须在 main 上）
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "✅ tag 指向的提交 $GITHUB_SHA 在 origin/main 的历史上，允许发布"
          else
            echo "::error::tag 指向的提交 $GITHUB_SHA 不在 main 历史上，禁止发布"
            exit 1
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 发布前质量门禁（后端单元测试）
        working-directory: backend
        run: mvn -B -ntp test

      - name: 打包发布制品
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION="${TAG#v}"
          bash scripts/package.sh "$VERSION" "$BUILD_NO" "$RUN_ID" "$COMMIT"
          echo "--- BUILD_INFO ---"
          cat dist/*/BUILD_INFO
          echo "--- sha256 ---"
          sha256sum dist/*.tar.gz

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "$TAG" \
            --notes "由 GitHub Actions 在 tag 所指提交上构建并发布：后端 jar + 前端构建产物 + BUILD_INFO + sha256。"
