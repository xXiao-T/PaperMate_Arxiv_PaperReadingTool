server:
  port: 8080

spring:
  profiles:
    active: local                         # 加载 application-local.yml（在 .gitignore 中，不含敏感信息）
  datasource:
    url: jdbc:mysql://localhost:3306/papermate?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: REPLACE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: smtp.qq.com
    port: 465
    username: REPLACE_ME@qq.com
    password: REPLACE_ME
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

jwt:
  secret: REPLACE_ME
  expiration: 86400000

papermate:
  jwt:
    secret: REPLACE_ME
    expiration-ms: 86400000
  ai:
    api-key: sk-placeholder
    model: deepseek-v4-pro
    base-url: https://api.deepseek.com
